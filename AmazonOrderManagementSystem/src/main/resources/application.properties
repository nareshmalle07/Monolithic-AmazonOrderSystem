spring.application.name=ORDER-SERVICE
#==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080

# ==========================================
# Eureka configuration
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# ORACLE DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/freepdb1
spring.datasource.username=ORDER_SERVICE_DB
spring.datasource.password=Bakka1234567
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ==========================================
# CONNECTION POOL (HIKARI)
# ==========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# ==========================================
# LOGGING
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


#jwt.secret=my-super-secret-key-for-jwt-token-generation-123456789
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [CorrelationID-%X{correlationId}] [TraceID-%X{trace_id}] [SpanID-%X{span_id}] %-5level %logger{36} - %msg%n
#===== ===== ===== ===== =====
# ===== OpenTelemetry =====
#===== ===== ===== ===== =====
otel.service.name=ORDER-SERVICE
## ------------------------if protocal is otlp then port is 4317
#otel.traces.exporter=otlp
## ------------------------if protocal is http/protobuf then port is 4318
otel.traces.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://localhost:4318
otel.metrics.exporter=none
otel.logs.exporter=none



















